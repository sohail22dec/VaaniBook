services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vaanibook-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - vaanibook-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8002}
    container_name: vaanibook-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3002}:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8002}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vaanibook-net

networks:
  vaanibook-net:
    driver: bridge
