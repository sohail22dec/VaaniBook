name: Continuous Delivery (CD) - Deploy to AWS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository name for Docker tags
        run: |
          echo "IMAGE_NAME_PREFIX=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v6.15.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-backend:${{ github.sha }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6.15.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://vaanibook.duckdns.org/api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-frontend:${{ github.sha }}

  deploy-to-aws:
    name: Auto Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [build-and-push]

    steps:
      - name: SSH to AWS and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "===> Resolving project directory on EC2..."
            PROJECT_DIR=""
            for dir in "/home/${{ secrets.EC2_USERNAME }}/VaaniBook" \
                       "/home/${{ secrets.EC2_USERNAME }}/vaani_book" \
                       "/home/${{ secrets.EC2_USERNAME }}/vaanibook" \
                       "/var/www/VaaniBook" \
                       "/var/www/vaani_book" \
                       "/var/www/vaanibook"; do
              if [ -d "$dir" ]; then
                PROJECT_DIR="$dir"
                echo "Found existing directory: $PROJECT_DIR"
                break
              fi
            done

            if [ -z "$PROJECT_DIR" ]; then
              PROJECT_DIR="/home/${{ secrets.EC2_USERNAME }}/vaani_book"
              echo "Directory not found. Cloning repository to $PROJECT_DIR..."
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi

            echo "===> Navigating to $PROJECT_DIR..."
            cd "$PROJECT_DIR"

            echo "===> Pulling latest code..."
            git fetch origin main || git fetch origin master
            git checkout main || git checkout master
            git pull origin main || git pull origin master

            echo "===> Checking environment configuration..."
            if [ ! -f ./backend/.env ] && [ -f ./backend/.env.example ]; then
              echo "Creating initial backend/.env from .env.example..."
              cp ./backend/.env.example ./backend/.env
            fi

            echo "===> Rebuilding and restarting containers..."
            docker compose down
            docker compose up -d --build

            echo "===> Cleaning unused Docker assets..."
            docker image prune -f

            echo "===> Deployment completed successfully!"
